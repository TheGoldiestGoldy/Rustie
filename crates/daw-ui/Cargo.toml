[package]
name = "daw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
daw-core.workspace = true
daw-engine = { path = "../daw-engine" }
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde_json = "1"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rtrb = "0.4.1"
hound = "3.5.1"
midir = "0.11.1"
libc = "0.2"
futures = "0.3"
pulseaudio = "0.3.2"
