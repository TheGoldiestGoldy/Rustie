[workspace]
resolver = "2"
members = [
    "crates/daw-core",
    "crates/daw-engine",
    "crates/daw-parser",
    "crates/daw-plugin-host",
    "crates/daw-host-client",
    "crates/daw-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
daw-core = { path = "crates/daw-core" }
